[package]
name = "e2b-dash"
version = "0.0.1"    # Keep IN SYNC with herdr-plugin.toml — `--version` prints this.
edition = "2021"

# Two binaries from one crate: the live board for boxes, and the report for a
# graded run. They share state.rs (the box records) and nothing else, so an
# explicit [[bin]] pair beats splitting the crate.
[[bin]]
name = "e2b-dash"
path = "src/main.rs"

[[bin]]
name = "e2b-bench"
path = "src/bin/e2b-bench.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
strip = true
